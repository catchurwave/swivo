name: E2E Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'swivo-app/package-lock.json'

      - name: Install dependencies
        run: cd swivo-app && npm ci

      - name: Install Playwright browsers
        run: cd swivo-app && npx playwright install --with-deps

      - name: Run E2E tests
        run: cd swivo-app && npm run test:e2e

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: swivo-app/playwright-report/
          retention-days: 30
