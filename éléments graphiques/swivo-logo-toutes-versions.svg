<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">

  <!-- ═══════════════════════════════════════════════ -->
  <!-- 1. VERSION FOND CLAIR (référence)              -->
  <!-- ═══════════════════════════════════════════════ -->
  <rect x="0" y="0" width="900" height="220" rx="16" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="40" y="34" font-family="Arial, sans-serif" font-size="11" fill="#9ca3af" letter-spacing="2">FOND CLAIR</text>

  <!-- icon -->
  <rect x="60" y="55" width="46" height="20" rx="10" fill="#7c3aed"/>
  <circle cx="83" cy="85" r="5" fill="#ec4899"/>
  <rect x="69" y="103" width="46" height="20" rx="10" fill="#ec4899"/>
  <circle cx="112" cy="57" r="3.5" fill="#ec4899" opacity="0.7"/>
  <!-- text -->
  <text x="122" y="103" font-family="Arial, sans-serif" font-size="52" font-weight="500" fill="#ec4899" letter-spacing="-2">sw<tspan fill="#7c3aed">ivo</tspan></text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- 2. VERSION FOND SOMBRE                        -->
  <!-- ═══════════════════════════════════════════════ -->
  <rect x="0" y="240" width="900" height="220" rx="16" fill="#0f0a1e"/>
  <text x="40" y="274" font-family="Arial, sans-serif" font-size="11" fill="#6b7280" letter-spacing="2">FOND SOMBRE</text>

  <rect x="60" y="295" width="46" height="20" rx="10" fill="#a78bfa"/>
  <circle cx="83" cy="325" r="5" fill="#f472b6"/>
  <rect x="69" y="343" width="46" height="20" rx="10" fill="#f472b6"/>
  <circle cx="112" cy="297" r="3.5" fill="#f472b6" opacity="0.7"/>
  <text x="122" y="343" font-family="Arial, sans-serif" font-size="52" font-weight="500" fill="#f472b6" letter-spacing="-2">sw<tspan fill="#a78bfa">ivo</tspan></text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- 3. VERSION FOND VIOLET                        -->
  <!-- ═══════════════════════════════════════════════ -->
  <rect x="0" y="480" width="900" height="220" rx="16" fill="#7c3aed"/>
  <text x="40" y="514" font-family="Arial, sans-serif" font-size="11" fill="#c4b5fd" letter-spacing="2">FOND VIOLET</text>

  <rect x="60" y="535" width="46" height="20" rx="10" fill="#ffffff" opacity="0.9"/>
  <circle cx="83" cy="565" r="5" fill="#fce7f3"/>
  <rect x="69" y="583" width="46" height="20" rx="10" fill="#fce7f3"/>
  <circle cx="112" cy="537" r="3.5" fill="#fce7f3" opacity="0.7"/>
  <text x="122" y="583" font-family="Arial, sans-serif" font-size="52" font-weight="500" fill="#fce7f3" letter-spacing="-2">sw<tspan fill="#ffffff">ivo</tspan></text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- 4. VERSION MONOCHROME NOIR                    -->
  <!-- ═══════════════════════════════════════════════ -->
  <rect x="0" y="720" width="900" height="220" rx="16" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="40" y="754" font-family="Arial, sans-serif" font-size="11" fill="#9ca3af" letter-spacing="2">MONOCHROME NOIR</text>

  <rect x="60" y="775" width="46" height="20" rx="10" fill="#111827"/>
  <circle cx="83" cy="805" r="5" fill="#374151"/>
  <rect x="69" y="823" width="46" height="20" rx="10" fill="#374151"/>
  <circle cx="112" cy="777" r="3.5" fill="#374151" opacity="0.7"/>
  <text x="122" y="823" font-family="Arial, sans-serif" font-size="52" font-weight="500" fill="#111827" letter-spacing="-2">swivo</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- 5. VERSION MONOCHROME BLANC                   -->
  <!-- ═══════════════════════════════════════════════ -->
  <rect x="0" y="960" width="900" height="220" rx="16" fill="#1f2937"/>
  <text x="40" y="994" font-family="Arial, sans-serif" font-size="11" fill="#6b7280" letter-spacing="2">MONOCHROME BLANC</text>

  <rect x="60" y="1015" width="46" height="20" rx="10" fill="#ffffff"/>
  <circle cx="83" cy="1045" r="5" fill="#e5e7eb"/>
  <rect x="69" y="1063" width="46" height="20" rx="10" fill="#e5e7eb"/>
  <circle cx="112" cy="1017" r="3.5" fill="#e5e7eb" opacity="0.7"/>
  <text x="122" y="1063" font-family="Arial, sans-serif" font-size="52" font-weight="500" fill="#ffffff" letter-spacing="-2">swivo</text>

</svg>
