<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="680" height="520">

  <!-- ── ICÔNE SEULE – 5 variantes ── -->

  <!-- Labels -->
  <text x="40" y="30" font-family="Arial, sans-serif" font-size="11" fill="#9ca3af" letter-spacing="2">ICÔNES SEULES (favicon / app)</text>

  <!-- 1. Grande couleur fond clair -->
  <rect x="40" y="50" width="96" height="96" rx="20" fill="#f5f3ff"/>
  <rect x="64" y="68" width="46" height="20" rx="10" fill="#7c3aed"/>
  <circle cx="87" cy="98" r="5" fill="#ec4899"/>
  <rect x="73" y="116" width="46" height="20" rx="10" fill="#ec4899"/>
  <circle cx="116" cy="70" r="3.5" fill="#ec4899" opacity="0.7"/>
  <text x="68" y="162" font-family="Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">96×96</text>

  <!-- 2. Grande couleur fond violet -->
  <rect x="160" y="50" width="96" height="96" rx="20" fill="#7c3aed"/>
  <rect x="184" y="68" width="46" height="20" rx="10" fill="#ffffff" opacity="0.9"/>
  <circle cx="207" cy="98" r="5" fill="#fce7f3"/>
  <rect x="193" y="116" width="46" height="20" rx="10" fill="#fce7f3"/>
  <circle cx="236" cy="70" r="3.5" fill="#fce7f3" opacity="0.7"/>
  <text x="208" y="162" font-family="Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">96×96</text>

  <!-- 3. Grande fond sombre -->
  <rect x="280" y="50" width="96" height="96" rx="20" fill="#0f0a1e"/>
  <rect x="304" y="68" width="46" height="20" rx="10" fill="#a78bfa"/>
  <circle cx="327" cy="98" r="5" fill="#f472b6"/>
  <rect x="313" y="116" width="46" height="20" rx="10" fill="#f472b6"/>
  <circle cx="356" cy="70" r="3.5" fill="#f472b6" opacity="0.7"/>
  <text x="328" y="162" font-family="Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">96×96</text>

  <!-- 4. Petite 48×48 couleur -->
  <rect x="400" y="50" width="48" height="48" rx="10" fill="#f5f3ff"/>
  <rect x="413" y="59" width="22" height="10" rx="5" fill="#7c3aed"/>
  <circle cx="424" cy="79" r="3" fill="#ec4899"/>
  <rect x="419" y="87" width="22" height="10" rx="5" fill="#ec4899"/>
  <text x="424" y="110" font-family="Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">48×48</text>

  <!-- 5. Petite 32×32 couleur -->
  <rect x="480" y="50" width="32" height="32" rx="7" fill="#7c3aed"/>
  <rect x="490" y="57" width="14" height="7" rx="3.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="497" cy="71" r="2" fill="#fce7f3"/>
  <rect x="494" y="77" width="14" height="7" rx="3.5" fill="#fce7f3"/>
  <text x="496" y="95" font-family="Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">32×32</text>

  <!-- ── LOGO HORIZONTAL COMPACT ── -->
  <text x="40" y="210" font-family="Arial, sans-serif" font-size="11" fill="#9ca3af" letter-spacing="2">LOGO HORIZONTAL COMPACT</text>

  <!-- fond clair -->
  <rect x="40" y="225" width="380" height="80" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="68" y="248" width="32" height="14" rx="7" fill="#7c3aed"/>
  <circle cx="84" cy="269" r="3.5" fill="#ec4899"/>
  <rect x="76" y="280" width="32" height="14" rx="7" fill="#ec4899"/>
  <circle cx="106" cy="250" r="2.5" fill="#ec4899" opacity="0.7"/>
  <text x="116" y="280" font-family="Arial, sans-serif" font-size="36" font-weight="500" fill="#ec4899" letter-spacing="-1">sw<tspan fill="#7c3aed">ivo</tspan></text>

  <!-- fond violet -->
  <rect x="440" y="225" width="220" height="80" rx="12" fill="#7c3aed"/>
  <rect x="460" y="248" width="32" height="14" rx="7" fill="#ffffff" opacity="0.9"/>
  <circle cx="476" cy="269" r="3.5" fill="#fce7f3"/>
  <rect x="468" y="280" width="32" height="14" rx="7" fill="#fce7f3"/>
  <circle cx="498" cy="250" r="2.5" fill="#fce7f3" opacity="0.7"/>
  <text x="508" y="280" font-family="Arial, sans-serif" font-size="36" font-weight="500" fill="#fce7f3" letter-spacing="-1">sw<tspan fill="#ffffff">ivo</tspan></text>

  <!-- ── LOGO AVEC SLOGAN ── -->
  <text x="40" y="360" font-family="Arial, sans-serif" font-size="11" fill="#9ca3af" letter-spacing="2">AVEC SLOGAN</text>

  <rect x="40" y="375" width="440" height="120" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="68" y="398" width="32" height="14" rx="7" fill="#7c3aed"/>
  <circle cx="84" cy="419" r="3.5" fill="#ec4899"/>
  <rect x="76" y="430" width="32" height="14" rx="7" fill="#ec4899"/>
  <circle cx="106" cy="400" r="2.5" fill="#ec4899" opacity="0.7"/>
  <text x="116" y="430" font-family="Arial, sans-serif" font-size="36" font-weight="500" fill="#ec4899" letter-spacing="-1">sw<tspan fill="#7c3aed">ivo</tspan></text>
  <line x1="116" y1="444" x2="196" y2="444" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="200" y1="444" x2="240" y2="444" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round"/>
  <text x="116" y="468" font-family="Arial, sans-serif" font-size="10" fill="#9ca3af" letter-spacing="3">CRÉATION &amp; GESTION D'ENTREPRISE</text>

</svg>
